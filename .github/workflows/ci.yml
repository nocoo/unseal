name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      runtime-version: "1.3.11"
      install-policy: "blocked"
      coverage-path: ""
      test-command: "bun run test:coverage"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
