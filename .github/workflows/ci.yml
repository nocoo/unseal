name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@v2026.2
    with:
      ignore-scripts: true
      bun-version: "1.3.11"
      test-command: "bun run test:coverage"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      enable-security: "true"
      upload-coverage: "false"
      enable-l2: "false"
    secrets: inherit
