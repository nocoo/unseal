# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, Z1 via quality.yml;
# na L1.5, L3; todo L2, P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.3.11"
      install-policy: blocked
      coverage-path: coverage
      test-command: bun run test:coverage
      lint-command: bun run lint
      typecheck-command: bun run typecheck
      osv-config: osv-scanner.toml
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-yamllint: true
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "不是 Cloudflare Worker 项目，无 workerd / vitest-pool-workers 运行时测试套件"},
        "L2": {"status": "todo", "reason": "docs/02-testing.md 规划的打包 CLI 子进程冒烟（--help/--version/TTY）尚未实现 test:api 或等价脚本"},
        "L3": {"status": "na", "reason": "无浏览器界面；macOS CLI，非 Playwright 场景"},
        "P1": {"status": "todo", "reason": "计划 npm 发布 unseal，尚未接入 ci:package / package-check（publint、attw 等）"},
        "Z1": {"status": "impl"}}
